# ─────────────────────────────────────────────────────────────────────
# Series catalog — FRED macro series definitions.
# Equity/market data is served by the fred-bronze-to-gold-pipeline via
# MACRO_DB_URL. This catalog covers FRED series only.
# ─────────────────────────────────────────────────────────────────────

# kept for schema compatibility (catalog.assets is read by _sync_masters)
assets: []

# ════════════════ MACRO SERIES (source: FRED, official) ════════════════
# fred_units: API transform — lin (level), pc1 (YoY%), pch (MoM%), chg (change).
macro:
  # --- Policy / money-market rates ---
  - series_id: DFF
    fred_id: DFF
    display_name: "Fed Funds Effective Rate"
    asset_class: MACRO_RATE
    category: RATES
    unit: percent
    fred_units: lin
    frequency: D
  - series_id: SOFR
    fred_id: SOFR
    display_name: "SOFR"
    asset_class: MACRO_RATE
    category: RATES
    unit: percent
    fred_units: lin
    frequency: D

  # --- Treasury curve ---
  - series_id: DGS3MO
    fred_id: DGS3MO
    display_name: "3M Treasury"
    asset_class: MACRO_RATE
    category: CURVE
    unit: percent
    fred_units: lin
    frequency: D
    tenor: "3M"
  - series_id: DGS2
    fred_id: DGS2
    display_name: "2Y Treasury"
    asset_class: MACRO_RATE
    category: CURVE
    unit: percent
    fred_units: lin
    frequency: D
    tenor: "2Y"
  - series_id: DGS5
    fred_id: DGS5
    display_name: "5Y Treasury"
    asset_class: MACRO_RATE
    category: CURVE
    unit: percent
    fred_units: lin
    frequency: D
    tenor: "5Y"
  - series_id: DGS10
    fred_id: DGS10
    display_name: "10Y Treasury"
    asset_class: MACRO_RATE
    category: CURVE
    unit: percent
    fred_units: lin
    frequency: D
    tenor: "10Y"
  - series_id: DGS30
    fred_id: DGS30
    display_name: "30Y Treasury"
    asset_class: MACRO_RATE
    category: CURVE
    unit: percent
    fred_units: lin
    frequency: D
    tenor: "30Y"

  # --- Inflation (index levels; analytics derive YoY/MoM) ---
  - series_id: CPIAUCSL
    fred_id: CPIAUCSL
    display_name: "CPI"
    asset_class: MACRO_INFLATION
    category: INFLATION
    unit: index
    fred_units: lin
    frequency: M
  - series_id: CPILFESL
    fred_id: CPILFESL
    display_name: "Core CPI"
    asset_class: MACRO_INFLATION
    category: INFLATION
    unit: index
    fred_units: lin
    frequency: M
  - series_id: PCEPI
    fred_id: PCEPI
    display_name: "PCE"
    asset_class: MACRO_INFLATION
    category: INFLATION
    unit: index
    fred_units: lin
    frequency: M
  - series_id: PCEPILFE
    fred_id: PCEPILFE
    display_name: "Core PCE"
    asset_class: MACRO_INFLATION
    category: INFLATION
    unit: index
    fred_units: lin
    frequency: M

  # --- Labor ---
  - series_id: UNRATE
    fred_id: UNRATE
    display_name: "Unemployment Rate"
    asset_class: MACRO_LABOR
    category: LABOR
    unit: percent
    fred_units: lin
    frequency: M
  - series_id: PAYEMS
    fred_id: PAYEMS
    display_name: "Nonfarm Payrolls"
    asset_class: MACRO_LABOR
    category: LABOR
    unit: thousands
    fred_units: chg
    frequency: M
  - series_id: ICSA
    fred_id: ICSA
    display_name: "Initial Jobless Claims"
    asset_class: MACRO_LABOR
    category: LABOR
    unit: count
    fred_units: lin
    frequency: W

  # --- Growth / activity ---
  - series_id: GDPC1
    fred_id: GDPC1
    display_name: "Real GDP"
    asset_class: MACRO_GROWTH
    category: GROWTH
    unit: billions_chained
    fred_units: lin
    frequency: Q
  - series_id: INDPRO
    fred_id: INDPRO
    display_name: "Industrial Production"
    asset_class: MACRO_GROWTH
    category: GROWTH
    unit: index
    fred_units: lin
    frequency: M
  - series_id: RSAFS
    fred_id: RSAFS
    display_name: "Retail Sales"
    asset_class: MACRO_GROWTH
    category: GROWTH
    unit: millions
    fred_units: lin
    frequency: M
  - series_id: HOUST
    fred_id: HOUST
    display_name: "Housing Starts"
    asset_class: MACRO_GROWTH
    category: HOUSING
    unit: thousands
    fred_units: lin
    frequency: M

  # --- Liquidity / money ---
  - series_id: M2SL
    fred_id: M2SL
    display_name: "M2 Money Supply"
    asset_class: MACRO_LIQUIDITY
    category: LIQUIDITY
    unit: billions
    fred_units: lin
    frequency: M

  # --- Credit spreads ---
  - series_id: BAMLH0A0HYM2
    fred_id: BAMLH0A0HYM2
    display_name: "High Yield OAS"
    asset_class: MACRO_CREDIT
    category: CREDIT
    unit: percent
    fred_units: lin
    frequency: D
  - series_id: BAMLC0A0CM
    fred_id: BAMLC0A0CM
    display_name: "IG Corporate OAS"
    asset_class: MACRO_CREDIT
    category: CREDIT
    unit: percent
    fred_units: lin
    frequency: D
